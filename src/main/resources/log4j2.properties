# Quiet Spark's startup chatter so the job's own output is readable.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n

# These two are noisy at WARN and say nothing useful in local mode.
logger.hadoop.name = org.apache.hadoop.util.NativeCodeLoader
logger.hadoop.level = error
logger.metastore.name = org.apache.spark.sql.internal.SharedState
logger.metastore.level = error
